<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate A Random Color</title>
    <!-- Link to CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main container to center content -->
    <div class="container">
        <!-- Heading that will display the generated color -->
        <h3 class="color-name">Generate A Random Color</h3>
        
        <!-- Button to trigger color generation -->
        <button class="btn generate-btn">Generate Color</button>
        
        <!-- Div that changes background color -->
        <div class="color-box">This is New Color</div>
    </div>

    <!-- Link to JS file -->
    <script src="script.js"></script>
</body>
</html>
